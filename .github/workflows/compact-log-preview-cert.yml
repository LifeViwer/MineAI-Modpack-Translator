name: Compact Log Preview Certification

on:
  push:
    branches: [fix/full-translation-log-lines]

permissions:
  contents: write

jobs:
  certify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-qt.txt
      - name: Apply compact preview patch
        run: python tools/patch_compact_log_preview.py
      - name: Compile
        run: python -m compileall -q mineai tests translator.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compact log preview smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/compact_log_preview_smoke.py

  publish:
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-translation-log-lines
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply verified compact preview patch
        run: python tools/patch_compact_log_preview.py
      - name: Commit production/test changes and remove temporary certification files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mineai/gui_qt/main_window.py mineai/gui_qt/log_model.py mineai/gui_qt/i18n.py tests/test_log_model.py
          git rm tools/patch_compact_log_preview.py tools/compact_log_preview_smoke.py .github/workflows/compact-log-preview-cert.yml
          git commit -m "fix(qt): keep huge translation logs compact and inspectable"
          git push origin HEAD:fix/full-translation-log-lines
