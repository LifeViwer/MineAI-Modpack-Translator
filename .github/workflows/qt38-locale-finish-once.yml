name: Apply Qt38 Locale Finish

on:
  push:
    branches:
      - work/qt38-ux-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/qt38-ux-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply final patch
        run: |
          python tools/patch_qt38_locale_finish.py
          python -m compileall -q mineai
      - name: Commit source
        run: |
          rm -f tools/patch_qt38_locale_finish.py .github/workflows/qt38-locale-finish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(qt): preserve engine state across locale switch [skip ci]"
          git push origin HEAD:work/qt38-ux-hardening
