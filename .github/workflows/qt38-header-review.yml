name: Qt38 Header Review Certification

on:
  push:
    branches:
      - work/qt38-header-controls-review

permissions:
  contents: write

jobs:
  linux-qt:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt
      - name: Apply review patch
        run: python tools/patch_qt_header_controls.py
      - name: Compile
        run: python -m compileall -q mineai tests translator.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Header, theme, language and layout smoke
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from PyQt6.QtCore import QPoint
          from PyQt6.QtWidgets import QApplication, QAbstractButton, QAbstractScrollArea, QComboBox
          from mineai.config import settings
          from mineai.gui_qt.dialogs import MigrationDialog, PromptEditorDialog, SettingsDialog
          from mineai.gui_qt.i18n import translator
          from mineai.gui_qt.main_window import TranslatorQtWindow

          app = QApplication([])
          settings.set_many('GENERAL', {'ui_language': 'ru', 'theme': 'Dark'})
          translator.set_language('ru')

          def inside_scroll_area(widget):
              parent = widget.parentWidget()
              while parent is not None:
                  if isinstance(parent, QAbstractScrollArea):
                      return True
                  parent = parent.parentWidget()
              return False

          def assert_not_clipped(root, label):
              app.processEvents()
              controls = list(root.findChildren(QAbstractButton)) + list(root.findChildren(QComboBox))
              checked = 0
              for control in controls:
                  if not control.isVisible() or inside_scroll_area(control):
                      continue
                  region = control.visibleRegion()
                  if region.isEmpty():
                      raise AssertionError(f'{label}: visible control has empty visible region: {control.objectName()} {control.text() if hasattr(control, "text") else ""}')
                  if not region.contains(control.rect()):
                      raise AssertionError(f'{label}: clipped control: {control.objectName()} geometry={control.geometry()} visible={region.boundingRect()}')
                  top_left = control.mapTo(root, QPoint(0, 0))
                  bottom_right = control.mapTo(root, control.rect().bottomRight())
                  if top_left.x() < 0 or top_left.y() < 0 or bottom_right.x() >= root.width() or bottom_right.y() >= root.height():
                      raise AssertionError(f'{label}: control outside window perimeter: {control.objectName()} from={top_left} to={bottom_right} root={root.size()}')
                  checked += 1
              if not checked:
                  raise AssertionError(f'{label}: no visible fixed controls checked')
              print(f'{label}: {checked} fixed controls fully inside')

          window = TranslatorQtWindow()
          window.resize(window.minimumSize())
          window.show()
          app.processEvents()
          assert window.interface_language.currentData() == 'ru'
          assert window.theme_button.text() == '☾'
          assert_not_clipped(window, 'main-min-dark-ru')

          window._toggle_theme()
          app.processEvents()
          assert settings.get('GENERAL', 'theme') == 'Light'
          assert window.theme_button.text() == '☀'
          assert_not_clipped(window, 'main-min-light-ru')

          en_index = window.interface_language.findData('en')
          assert en_index >= 0
          window.interface_language.setCurrentIndex(en_index)
          for _ in range(4):
              app.processEvents()
          assert translator.language == 'en'
          assert settings.get('GENERAL', 'ui_language') == 'en'
          assert window.interface_language.currentData() == 'en'
          assert_not_clipped(window, 'main-min-light-en')

          # Also verify a common laptop-sized client area above the enforced minimum.
          window.resize(1366, 768)
          app.processEvents()
          assert_not_clipped(window, 'main-1366x768-light-en')

          settings_dialog = SettingsDialog(settings, lambda: None, window)
          assert not hasattr(settings_dialog, 'ui_language')
          assert not hasattr(settings_dialog, 'theme')
          settings_dialog.resize(settings_dialog.minimumSize())
          settings_dialog.show()
          app.processEvents()
          assert_not_clipped(settings_dialog, 'settings-min')
          settings_dialog.close()

          prompts = PromptEditorDialog(window)
          prompts.resize(prompts.minimumSize())
          prompts.show()
          app.processEvents()
          assert_not_clipped(prompts, 'prompts-min')
          prompts._dirty = False
          prompts.close()

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              (root / 'mods').mkdir()
              migration = MigrationDialog(str(root), 'Русский', window.cache_std, window.cache_ai, lambda *_: None, window)
              migration.resize(migration.minimumSize())
              migration.show()
              app.processEvents()
              assert_not_clipped(migration, 'migration-min')
              migration.close()

          window.close()
          app.processEvents()
          print('Header/theme/language/layout smoke: PASS')
          PY

  windows-qt:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qt.txt pyinstaller
      - name: Apply review patch
        run: python tools/patch_qt_header_controls.py
      - name: Compile
        run: python -m compileall -q mineai tests translator.py
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Native header and layout smoke
        shell: pwsh
        run: |
          @'
          import tempfile
          from pathlib import Path
          from PyQt6.QtCore import QPoint
          from PyQt6.QtWidgets import QApplication, QAbstractButton, QAbstractScrollArea, QComboBox
          from mineai.config import settings
          from mineai.gui_qt.dialogs import MigrationDialog, PromptEditorDialog, SettingsDialog
          from mineai.gui_qt.i18n import translator
          from mineai.gui_qt.main_window import TranslatorQtWindow

          app = QApplication([])
          settings.set_many('GENERAL', {'ui_language': 'ru', 'theme': 'Dark'})
          translator.set_language('ru')

          def inside_scroll_area(widget):
              parent = widget.parentWidget()
              while parent is not None:
                  if isinstance(parent, QAbstractScrollArea):
                      return True
                  parent = parent.parentWidget()
              return False

          def assert_not_clipped(root, label):
              app.processEvents()
              controls = list(root.findChildren(QAbstractButton)) + list(root.findChildren(QComboBox))
              checked = 0
              for control in controls:
                  if not control.isVisible() or inside_scroll_area(control):
                      continue
                  region = control.visibleRegion()
                  if region.isEmpty() or not region.contains(control.rect()):
                      raise AssertionError(f'{label}: clipped control {control.objectName()} geometry={control.geometry()} visible={region.boundingRect()}')
                  top_left = control.mapTo(root, QPoint(0, 0))
                  bottom_right = control.mapTo(root, control.rect().bottomRight())
                  if top_left.x() < 0 or top_left.y() < 0 or bottom_right.x() >= root.width() or bottom_right.y() >= root.height():
                      raise AssertionError(f'{label}: control outside window perimeter {control.objectName()} from={top_left} to={bottom_right} root={root.size()}')
                  checked += 1
              if not checked:
                  raise AssertionError(f'{label}: no fixed controls checked')
              print(f'{label}: {checked} fixed controls fully inside')

          window = TranslatorQtWindow()
          window.resize(window.minimumSize())
          window.show(); app.processEvents()
          assert window.theme_button.text() == '☾'
          assert_not_clipped(window, 'windows-main-min-dark-ru')
          window._toggle_theme(); app.processEvents()
          assert window.theme_button.text() == '☀'
          en_index = window.interface_language.findData('en')
          window.interface_language.setCurrentIndex(en_index)
          for _ in range(4): app.processEvents()
          assert window.interface_language.currentData() == 'en'
          assert_not_clipped(window, 'windows-main-min-light-en')

          settings_dialog = SettingsDialog(settings, lambda: None, window)
          settings_dialog.resize(settings_dialog.minimumSize()); settings_dialog.show(); app.processEvents()
          assert_not_clipped(settings_dialog, 'windows-settings-min'); settings_dialog.close()
          prompts = PromptEditorDialog(window)
          prompts.resize(prompts.minimumSize()); prompts.show(); app.processEvents()
          assert_not_clipped(prompts, 'windows-prompts-min'); prompts._dirty = False; prompts.close()
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp); (root / 'mods').mkdir()
              migration = MigrationDialog(str(root), 'Русский', window.cache_std, window.cache_ai, lambda *_: None, window)
              migration.resize(migration.minimumSize()); migration.show(); app.processEvents()
              assert_not_clipped(migration, 'windows-migration-min'); migration.close()
          window.close(); app.processEvents()
          print('Windows native header/layout smoke: PASS')
          '@ | python -
      - name: PyInstaller preview
        shell: pwsh
        run: |
          Set-Content -Path qt_preview_entry.py -Encoding utf8 -Value 'from mineai.gui_qt import run; raise SystemExit(run())'
          pyinstaller --noconfirm --clean --onefile --windowed --name MineAI_Qt_Header_Preview --icon icon.ico --add-data "icon.ico;." --add-data "icon.png;." qt_preview_entry.py
          if (!(Test-Path 'dist/MineAI_Qt_Header_Preview.exe')) { throw 'EXE was not built' }

  publish-staged-tree:
    needs: [linux-qt, windows-qt]
    runs-on: ubuntu-24.04
    if: success()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply verified patch
        run: python tools/patch_qt_header_controls.py
      - name: Commit verified production changes
        run: |
          git config user.name "LifeViwer"
          git config user.email "36803375+LifeViwer@users.noreply.github.com"
          git add mineai/gui_qt/dialogs.py mineai/gui_qt/i18n.py mineai/gui_qt/main_window.py mineai/gui_qt/theme.py
          git commit -m "fix(qt): move locale and theme controls to header [skip ci]"
          git push origin HEAD:work/qt38-header-controls-review
