name: Qt round2 certification

on:
  push:
    branches: [work/qt-windows-polish-round2]
    paths:
      - .github/workflows/qt-round2-cert.yml

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/qt-windows-polish-round2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -r requirements-qt.txt
      - name: Apply candidate patch
        run: |
          python tools/apply_qt_windows_polish_round2.py
          python tools/apply_qt_windows_polish_round2_followup.py
      - name: Compile
        run: python -m compileall -q mineai tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Qt smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/qt_round2_smoke.py

  materialize:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/qt-windows-polish-round2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply verified patch
        run: |
          python tools/apply_qt_windows_polish_round2.py
          python tools/apply_qt_windows_polish_round2_followup.py
      - name: Commit verified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mineai/gui_qt/main_window.py mineai/gui_qt/theme.py mineai/gui_qt/view_model.py tests/test_qt_ux_hardening.py tests/test_qt_view_model.py tests/test_qt_windows_ux.py
          git commit -m "fix(qt): polish Windows layout and state sync [materialized]"
          git push origin HEAD:work/qt-windows-polish-round2

# certification rerun after smoke import-path fix
