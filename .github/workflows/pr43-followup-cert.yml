name: PR43 follow-up certification

on:
  push:
    branches:
      - work/pr43-followup-cert
    paths:
      - .github/workflows/pr43-followup-cert.yml

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -r requirements-qt.txt
      - name: Apply candidate patch
        run: python tools/apply_pr43_followup.py
      - name: Compile
        run: python -m compileall -q mineai tests
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

  materialize:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply certified patch
        run: python tools/apply_pr43_followup.py
      - name: Commit certified files
        run: |
          git config user.name "LifeViwer"
          git config user.email "36803375+LifeViwer@users.noreply.github.com"
          git add mineai/gui_qt/dialogs.py mineai/gui_qt/main_window.py tests/test_qt_windows_ux.py
          git commit -m "fix(qt): keep settings spin arrows visible and honor log autoscroll"
          git push origin HEAD:work/pr43-followup-cert
