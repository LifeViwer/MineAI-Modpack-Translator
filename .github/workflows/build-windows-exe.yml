name: Build Windows EXE

on:
  push:
    branches:
      - build/windows-exe-9.2.1-fix

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --noconsole
          --icon=icon.ico
          --name=MineAI_Translator
          mineai/__main__.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MineAI_Translator.exe")) { throw "EXE was not created" }
          $bytes = [System.IO.File]::ReadAllBytes("dist/MineAI_Translator.exe")
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid PE header" }
          Get-Item "dist/MineAI_Translator.exe" | Format-List Name,Length
          Get-FileHash "dist/MineAI_Translator.exe" -Algorithm SHA256

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: MineAI_Translator-9.2.1-api-url-fix-windows-x64
          path: dist/MineAI_Translator.exe
          if-no-files-found: error
          retention-days: 7
