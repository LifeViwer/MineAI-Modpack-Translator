name: Build combined Windows ZIP

on:
  push:
    branches:
      - test/windows-beta-pr21-pr22-pr23-pr24-pr25

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller

      - name: Compile and test
        shell: pwsh
        run: |
          python -m compileall -q mineai tests translator.py
          python -m unittest discover -s tests -v

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --noconsole
          --icon=icon.ico
          --add-data "mineai/data;mineai/data"
          --name=MineAI_Translator
          mineai/__main__.py

      - name: Create and verify ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MineAI_Translator.exe")) { throw "EXE was not created" }
          $bytes = [System.IO.File]::ReadAllBytes("dist/MineAI_Translator.exe")
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid PE header" }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item dist/MineAI_Translator.exe package/
          Copy-Item README.md package/
          Copy-Item docs/GLOSSARIES_RU.md package/
          Copy-Item examples/glossary.user.example.json package/
          Compress-Archive -Path package/* -DestinationPath MineAI_Translator-beta-PR21-25-windows-x64.zip
          Get-Item dist/MineAI_Translator.exe, MineAI_Translator-beta-PR21-25-windows-x64.zip | Format-Table Name,Length
          Get-FileHash dist/MineAI_Translator.exe, MineAI_Translator-beta-PR21-25-windows-x64.zip -Algorithm SHA256

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MineAI_Translator-beta-PR21-25-windows-x64
          path: MineAI_Translator-beta-PR21-25-windows-x64.zip
          if-no-files-found: error
          retention-days: 7
