name: Qt Review Round 2 Certification

on:
  push:
    branches:
      - fix/qt-layout-localization-batch-tooltips

jobs:
  linux-qt:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-qt.txt
      - name: Apply review patch
        run: python tools/patch_qt_review_round2.py
      - name: Compile
        run: python -m compileall -q mineai tests
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Qt layout and localization smoke
        run: python tools/qt_review_round2_smoke.py

  windows-qt:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-qt.txt
          pip install pyinstaller
      - name: Apply review patch
        run: python tools/patch_qt_review_round2.py
      - name: Compile
        run: python -m compileall -q mineai tests
      - name: Full unit suite
        run: python -m unittest discover -s tests -v
      - name: Native Qt layout and localization smoke
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/qt_review_round2_smoke.py
      - name: PyInstaller preview
        run: pyinstaller --noconfirm --clean --windowed --name MineAI-Qt-Review-Round2 mineai/gui_qt/__main__.py
