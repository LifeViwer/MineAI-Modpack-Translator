name: Windows Release Certification

on:
  push:
    branches: [cert/windows-beta-97f6db6]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cert:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Compile sources
        run: python -m compileall -q mineai tests translator.py
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Build EXE
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --icon="icon.ico" --add-data "icon.ico;." --name "MineAI_Translator" mineai\__main__.py
      - name: Verify EXE exists
        shell: powershell
        run: |
          if (-not (Test-Path "dist\MineAI_Translator.exe")) { throw "EXE was not created" }
          $size = (Get-Item "dist\MineAI_Translator.exe").Length
          if ($size -lt 1000000) { throw "EXE looks unexpectedly small: $size bytes" }
          Write-Host "EXE size: $size bytes"
      - name: Startup smoke
        shell: powershell
        run: |
          $p = Start-Process -FilePath (Resolve-Path "dist\MineAI_Translator.exe") -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "MineAI_Translator.exe exited during startup smoke with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          $p.WaitForExit()
          Write-Host "EXE stayed alive for startup smoke and was terminated by the certification job."
